[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["The Barrage contributors"]

[workspace.dependencies]
# Internal crates
barrage-plan = { path = "crates/plan", version = "0.0.0" }
barrage-engine = { path = "crates/engine", version = "0.0.0" }
barrage-protocol = { path = "crates/protocol", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Allowed in tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
