name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal plan file helps a lot. Remove any private URLs or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Barrage version
      placeholder: "0.1.0 (app) / barrage --version"
  - type: input
    id: os
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.2, M3"
