# SPDX-License-Identifier: MIT
#
# The gate in CI: `just setup && just check` on macOS, same as locally.
# A second job builds the desktop app (debug, no bundle) so Tauri breakage shows up too.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check:
    name: just check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      # Installs JS deps and the toolchain pinned in rust-toolchain.toml.
      - name: just setup
        run: just setup

      # After setup so the cache key sees the pinned toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: just check
        run: just check

  desktop:
    name: desktop build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      # Builds the UI (beforeBuildCommand) and the debug app binary; skips dmg packaging.
      - name: tauri build --debug
        run: pnpm --filter @barrage/desktop tauri build --debug --no-bundle
