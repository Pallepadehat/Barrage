[package]
name = "barrage-desktop"
description = "Barrage desktop app: the Tauri shell around the React UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
barrage-protocol.workspace = true
serde.workspace = true
# `macos-private-api` allows the transparent window the sidebar vibrancy needs.
tauri = { workspace = true, features = ["macos-private-api"] }
# Spawns the engine sidecar and owns its pipes (PRD: sidecar IPC over stdio).
tauri-plugin-shell.workspace = true

[lints]
workspace = true
